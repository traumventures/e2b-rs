[package]
name = "e2b-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Async Rust SDK for E2B sandboxes, wire-compatible with the official E2B JS/Python SDKs"
license = "Apache-2.0"
readme = "README.md"
keywords = ["e2b", "sandbox", "firecracker", "agents"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "e2b"

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
futures = "0.3"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset", "multipart"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
