[package]
name = "e2b-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Async Rust SDK for E2B sandboxes, wire-compatible with the official E2B JS/Python SDKs"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/traumventures/e2b-rs"
keywords = ["e2b", "sandbox", "firecracker", "agents"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "e2b"

[dependencies]
base64 = "0.23"
bytes = "1.12"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
futures = "0.3.34"
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "charset", "multipart", "query"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
